<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Marketplace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="auth-shell">
    <div class="card">
      <h1 data-i18n="login_title">Welcome back</h1>
      <p class="sub" data-i18n="login_subtitle">Log in to see your inquiries and their progress.</p>

      <div class="form-msg" id="login-msg"></div>

      <form id="login-form">
        <div class="field">
          <label for="email" data-i18n="login_email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password" data-i18n="login_password">Password</label>
          <div class="input-with-action">
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <button type="button" class="input-icon-btn" data-toggle-password="password" aria-label="Show password">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="forgot-link-row">
          <a href="#" id="forgot-password-link" data-i18n="login_forgot_link">Forgot password?</a>
        </div>

        <div class="forgot-panel hidden" id="forgot-password-panel">
          <div class="field">
            <label for="reset-email" data-i18n="login_reset_email_label">Enter your email</label>
            <input type="email" id="reset-email" autocomplete="email">
          </div>
          <button type="button" id="send-reset-btn" class="btn btn-outline btn-block btn-sm" data-i18n="login_reset_send">Send reset link</button>
          <div class="form-msg" id="reset-msg" style="margin-top:10px; margin-bottom:0;"></div>
        </div>

        <button type="submit" class="btn btn-gold btn-block" data-i18n="login_button">Log in</button>
      </form>

      <p class="switch">
        <span data-i18n="login_no_account">Don't have an account?</span>
        <a href="/signup/" data-i18n="login_signup_link">Sign up</a>
      </p>
    </div>
  </div>

  <div id="site-footer"></div>

  <script type="module">
    import { renderChrome } from '/js/components.js';
    import { initLoginForm, initPasswordToggles, initForgotPassword } from '/js/auth.js';
    renderChrome();
    initLoginForm();
    initPasswordToggles();
    initForgotPassword();
  </script>
</body>
</html>
