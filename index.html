<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haki Boutique</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/assets/logo.png">
</head>
<body>
  <div id="site-header"></div>

  <section class="hero">
    <div class="container">
      <span class="eyebrow" data-i18n="hero_eyebrow">Buy and sell directly</span>
      <h1 data-i18n="hero_title">Find what you need, deal directly</h1>
      <p data-i18n="hero_subtitle">Browse listings, then contact the seller to agree on a price.</p>
      <form class="search-bar" onsubmit="event.preventDefault(); window.location.href = '/products/?q=' + encodeURIComponent(this.q.value);">
        <input type="text" name="q" data-i18n-placeholder="search_placeholder" placeholder="Search products...">
        <button type="submit" data-i18n="search_button">Search</button>
      </form>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head reveal">
        <h2 data-i18n="featured_title">Featured products</h2>
        <a href="/products/" data-i18n="featured_viewall">View all</a>
      </div>
      <div class="product-grid" id="featured-grid"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script type="module">
    import { renderChrome } from '/js/components.js';
    import { renderFeatured, activateReveal } from '/js/products.js';
    import { showLoader, hideLoader } from '/js/loader.js';
    import { updatePriceDisplays } from '/js/currency.js';

    document.addEventListener('translations-ready', async () => {
      showLoader();
      await renderFeatured('featured-grid', 3);
      hideLoader();
    });
    document.addEventListener('currency-changed', () => {
      updatePriceDisplays(document.getElementById('featured-grid'));
    });
    renderChrome();
    activateReveal(document.querySelector('.section'));
  </script>
</body>
</html>
