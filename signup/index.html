<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Marketplace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="auth-shell">
    <div class="card">
      <h1 data-i18n="signup_title">Create your account</h1>
      <p class="sub" data-i18n="signup_subtitle">Sign up to start contacting sellers and track your progress.</p>

      <div class="form-msg" id="signup-msg"></div>

      <form id="signup-form">
        <div class="field">
          <label for="name" data-i18n="signup_name">Full name</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email" data-i18n="signup_email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password" data-i18n="signup_password">Password</label>
          <div class="input-with-action">
            <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
            <button type="button" class="input-icon-btn" data-toggle-password="password" aria-label="Show password">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm-password" data-i18n="signup_confirm_password">Confirm password</label>
          <div class="input-with-action">
            <input type="password" id="confirm-password" name="confirmPassword" required minlength="6" autocomplete="new-password">
            <button type="button" class="input-icon-btn" data-toggle-password="confirm-password" aria-label="Show password">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-gold btn-block" data-i18n="signup_button">Create account</button>
      </form>

      <p class="switch">
        <span data-i18n="signup_has_account">Already have an account?</span>
        <a href="/login/" data-i18n="signup_login_link">Log in</a>
      </p>
    </div>
  </div>

  <div id="site-footer"></div>

  <script type="module">
    import { renderChrome } from '/js/components.js';
    import { initSignupForm, initPasswordToggles } from '/js/auth.js';
    renderChrome();
    initSignupForm();
    initPasswordToggles();
  </script>
</body>
</html>
