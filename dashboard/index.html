<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My inquiries — Marketplace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="section">
    <div class="container" style="max-width:760px;">
      <h1 class="panel-title" style="font-size:24px;" data-i18n="dashboard_title">My inquiries</h1>
      <p class="panel-sub" data-i18n="dashboard_subtitle">Track the progress of every product you've contacted a seller about.</p>

      <div id="inquiry-list"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script type="module">
    import { renderChrome } from '/js/components.js';
    import { initDashboard } from '/js/dashboard.js';
    import { showLoader, hideLoader } from '/js/loader.js';

    showLoader();
    renderChrome();
    initDashboard().finally(() => hideLoader());
  </script>
</body>
</html>
