<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Marketplace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="section">
    <div class="container">
      <div id="product-detail" style="display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start;"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <style>
    @media (max-width: 720px) {
      #product-detail { grid-template-columns: 1fr !important; }
    }
  </style>

  <script type="module">
    import { renderChrome } from '/js/components.js';
    import { initProductDetail } from '/js/product-detail.js';
    import { showLoader, hideLoader } from '/js/loader.js';

    showLoader();
    renderChrome();
    initProductDetail().finally(() => hideLoader());
  </script>
</body>
</html>
